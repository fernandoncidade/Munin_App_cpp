name: Update Version in README

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract version from push commits
        id: extract_version
        shell: bash
        run: |
          set -euo pipefail
          EVENT="$GITHUB_EVENT_PATH"
          REGEX='v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'

          echo "=== DEBUG: inspecting push payload ==="
          jq -r '.head_commit.message // "NO_HEAD_COMMIT_MESSAGE"' "$EVENT" || true

          VERSION=""

          # 1) tentativas no head_commit
          HEAD_MSG=$(jq -r '.head_commit.message // ""' "$EVENT")
          if echo "$HEAD_MSG" | grep -oE "$REGEX" >/dev/null; then
            VERSION=$(echo "$HEAD_MSG" | grep -oE "$REGEX" | tail -1)
          fi

          # 2) se não achou no head, procurar no array de commits (do mais recente para o mais antigo)
          if [ -z "$VERSION" ]; then
            while IFS= read -r msg; do
              if echo "$msg" | grep -oE "$REGEX" >/dev/null; then
                VERSION=$(echo "$msg" | grep -oE "$REGEX" | tail -1)
                break
              fi
            done < <(jq -r '.commits | reverse | .[].message' "$EVENT")
          fi

          # 3) fallback: procurar no histórico git recente
          if [ -z "$VERSION" ]; then
            if git log -20 --pretty=%B | grep -oE "$REGEX" >/dev/null; then
              VERSION=$(git log -20 --pretty=%B | grep -oE "$REGEX" | head -1)
            fi
          fi

          if [ -n "$VERSION" ]; then
            echo "Version found: $VERSION"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "has_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "No version pattern found in push"
            echo "has_version=false" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Debug - Show current README versions
        if: steps.extract_version.outputs.has_version == 'true'
        run: |
          echo "=== Current versions in README.md ==="
          grep -n -E 'v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' README.md || echo "No versions found"
          grep -n -E 'Data técnica desta revisão|Technical revision date' README.md || echo "No revision dates found"
          echo "====================================="
      
      - name: Update README.md
        if: steps.extract_version.outputs.has_version == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.extract_version.outputs.version }}"
          echo "Updating README.md with version $VERSION"

          cp README.md README.md.bak

          VERSION="$VERSION" python3 <<'PY'
          import os
          import re
          from datetime import date
          from pathlib import Path

          version = os.environ["VERSION"]
          match = re.fullmatch(r"v(\d{4})\.(\d{1,2})\.(\d{1,2})\.(\d+)", version)
          if not match:
              raise SystemExit(f"Invalid version format: {version}")

          year = int(match.group(1))
          month = int(match.group(2))
          day = int(match.group(3))
          revision_date = date(year, month, day)

          pt_months = {
              1: "janeiro",
              2: "fevereiro",
              3: "março",
              4: "abril",
              5: "maio",
              6: "junho",
              7: "julho",
              8: "agosto",
              9: "setembro",
              10: "outubro",
              11: "novembro",
              12: "dezembro",
          }
          en_months = {
              1: "January",
              2: "February",
              3: "March",
              4: "April",
              5: "May",
              6: "June",
              7: "July",
              8: "August",
              9: "September",
              10: "October",
              11: "November",
              12: "December",
          }

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          text, version_count = re.subn(
              r"v\d{4}\.\d{1,2}\.\d{1,2}\.\d+",
              version,
              text,
          )
          text, pt_date_count = re.subn(
              r"Data técnica desta revisão: .*?<br>",
              (
                  "Data técnica desta revisão: "
                  f"{revision_date.day} de {pt_months[revision_date.month]} de {revision_date.year}<br>"
              ),
              text,
          )
          text, en_date_count = re.subn(
              r"Technical revision date: .*?<br>",
              (
                  "Technical revision date: "
                  f"{en_months[revision_date.month]} {revision_date.day}, {revision_date.year}<br>"
              ),
              text,
          )

          if version_count == 0:
              raise SystemExit("No README version occurrences were updated")
          if pt_date_count == 0:
              raise SystemExit("Portuguese technical revision date was not updated")
          if en_date_count == 0:
              raise SystemExit("English technical revision date was not updated")

          with readme.open("w", encoding="utf-8", newline="\n") as file:
              file.write(text)

          print(f"Updated {version_count} version occurrence(s)")
          print(f"Updated {pt_date_count} Portuguese technical revision date line(s)")
          print(f"Updated {en_date_count} English technical revision date line(s)")
          PY

          echo "=== Changes made ==="
          diff -u README.md.bak README.md || true
          echo "===================="

          rm README.md.bak
          echo "README.md updated with version $VERSION"
      
      - name: Check for changes
        if: steps.extract_version.outputs.has_version == 'true'
        id: check_changes
        run: |
          if git diff --quiet README.md; then
            echo "No changes detected in README.md"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in README.md:"
            git diff README.md
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.extract_version.outputs.has_version == 'true' && steps.check_changes.outputs.has_changes == 'true'
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "chore: update version to $VERSION in README.md [skip ci]"
          git pull --rebase
          git push
